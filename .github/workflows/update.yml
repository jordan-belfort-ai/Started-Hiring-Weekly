name: update page
on:
  schedule:
    - cron: "17 6 * * *"   # after the daily index build (04:00-05:30 UTC)
    - cron: "17 12 * * *"  # catch-up if the build was late
  workflow_dispatch:
  push:
    paths: ["hand-wrong.csv"]   # a hand check drop goes up the same hour (8 Nov)
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: bash scripts/update.sh
      - run: |
          git config user.name "jordan-belfort-ai"
          git config user.email "jordan-belfort-ai@users.noreply.github.com"
          git add index.html started-hiring.csv watchlist-2plus.csv boards-prev.txt built.txt scripts/src/company_domains.json
          git add boards-before.txt hand-wrong.sha 2>/dev/null || true   # absent until the first render with update.sh of 8 Nov
          git diff --cached --quiet || git commit -m "Week to $(cut -c1-10 built.txt)"
          git push
